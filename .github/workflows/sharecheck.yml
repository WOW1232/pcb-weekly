name: 주식수 점검(임시)
on: workflow_dispatch
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python tools/share_probe.py
      - run: |
          git config user.name pcb-bot; git config user.email pcb-bot@users.noreply.github.com
          git add probe && git commit -qm "share probe" && git push
